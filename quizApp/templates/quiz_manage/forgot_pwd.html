{% extends "quiz_manage/base.html" %}
{% load static %}
{% block main-content %}
    <div class="authincation h-100">
        <div class="container h-100">
            <div class="row justify-content-center h-100 align-items-center">
                <div class="col-md-6">
                    <div class="authincation-content">
                        <div class="row no-gutters">
                            <div class="col-xl-12">
                                <div class="auth-form">
									<div class="text-center mb-3">
										<a href="{% url 'login_page' %}"><img src="{% static 'quiz_manage/images/profile.png' %}" alt="" style="width: 75px; height: 75px;"></a>
									</div>
                                    <h4 class="text-center mb-4">Forgot Password</h4>
                                    <form method="post" action="{% url 'forgot_pwd' %}">
                                        {% csrf_token %}
                                        {% include 'quiz_manage/alert.html' %}
                                        <div class="form-group">
                                            <label><strong>Email</strong></label>
                                            <input type="email" name="email" class="form-control" placeholder="hello@example.com" required>
                                        </div>
                                        <div class="text-center">
                                            <button type="submit" class="btn btn-primary btn-block">SUBMIT</button>
                                        </div>
                                    </form>
                                    <div class="new-account mt-3">
                                        <p>Remembered your password? <a class="text-primary" href="{% url 'login_page' %}">Back to Login</a></p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
