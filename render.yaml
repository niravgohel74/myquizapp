services:
  - type: web
    name: quizapp
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn quizproject.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
